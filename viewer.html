<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>XMind Embed Viewer (Development)</title>
</head>
<body>
<div id="mount"></div>
</body>
<script src="assets/js/xmind-embed-viewer.js"></script>
<script>
    const init = async () => {
        const res = await fetch('Java知识体系.xmind')
        const viewer = new XMindEmbedViewer({
            el: '#mount',
            file: await res.arrayBuffer(),
            region: 'cn',
            styles: {
                'height': ((document.documentElement.clientHeight || document.body.clientHeight) - 30) + "px",
                'width': ((document.documentElement.clientWidth || document.body.clientWidth) - 30) + "px"
            }
        })
    }
    init()
</script>
</html>
