<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#546e7a" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#999" />
    </filter>
  </defs>

  <!-- Background Title -->
  <text x="450" y="40" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="24" font-weight="bold" fill="#2c3e50">Spring Cloud Gateway 技术架构图</text>

  <!-- Client Section -->
  <g transform="translate(50, 250)">
    <rect x="0" y="0" width="100" height="100" rx="10" fill="#e1f5fe" stroke="#01579b" stroke-width="2" filter="url(#shadow)" />
    <text x="50" y="55" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="14" font-weight="bold" fill="#01579b">客户端</text>
    <text x="50" y="75" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="10" fill="#01579b">(Web / 移动端)</text>
  </g>

  <!-- Request Arrow -->
  <line x1="150" y1="300" x2="210" y2="300" stroke="#546e7a" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="180" y="290" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="12" fill="#546e7a">HTTP 请求</text>

  <!-- Gateway Main Box -->
  <g transform="translate(220, 100)">
    <rect x="0" y="0" width="460" height="400" rx="10" fill="none" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5,5" />
    <text x="10" y="25" font-family="Microsoft YaHei, Arial" font-size="14" font-weight="bold" fill="#2e7d32">Spring Cloud Gateway 网关</text>

    <!-- Handler Mapping -->
    <g transform="translate(30, 150)">
      <rect x="0" y="0" width="150" height="100" rx="5" fill="#fff9c4" stroke="#fbc02d" stroke-width="2" filter="url(#shadow)" />
      <text x="75" y="45" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="13" font-weight="bold" fill="#f57f17">网关处理器映射</text>
      <text x="75" y="65" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="11" fill="#f57f17">(Handler Mapping)</text>
    </g>

    <!-- Arrow Mapping to Web Handler -->
    <line x1="180" y1="200" x2="230" y2="200" stroke="#546e7a" stroke-width="2" marker-end="url(#arrowhead)" />

    <!-- Web Handler -->
    <g transform="translate(250, 50)">
      <rect x="0" y="0" width="180" height="300" rx="5" fill="#f1f8e9" stroke="#558b2f" stroke-width="2" filter="url(#shadow)" />
      <text x="90" y="30" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="13" font-weight="bold" fill="#33691e">网关 Web 处理器</text>

      <!-- Filters Container -->
      <g transform="translate(20, 60)">
        <rect x="0" y="0" width="140" height="200" rx="5" fill="#ffffff" stroke="#aed581" stroke-width="1.5" />
        <text x="70" y="25" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="12" font-weight="bold" fill="#558b2f">过滤器链 (Filters)</text>

        <!-- Pre Filter -->
        <rect x="20" y="45" width="100" height="40" rx="3" fill="#e8f5e9" stroke="#4caf50" stroke-width="1" />
        <text x="70" y="70" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="11" fill="#2e7d32">Pre 前置过滤</text>

        <!-- Proxy Logic -->
        <rect x="15" y="100" width="110" height="30" rx="3" fill="#fff" stroke="#558b2f" stroke-dasharray="2,2" />
        <text x="70" y="120" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="10" fill="#33691e">代理转发逻辑</text>

        <!-- Post Filter -->
        <rect x="20" y="145" width="100" height="40" rx="3" fill="#e8f5e9" stroke="#4caf50" stroke-width="1" />
        <text x="70" y="170" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="11" fill="#2e7d32">Post 后置过滤</text>
      </g>
    </g>
  </g>

  <!-- Forwarding Arrow -->
  <line x1="680" y1="260" x2="740" y2="260" stroke="#d32f2f" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="710" y="250" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="11" fill="#d32f2f">反向代理</text>

  <!-- Proxied Service Section -->
  <g transform="translate(750, 200)">
    <rect x="0" y="0" width="120" height="200" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2" filter="url(#shadow)" />
    <text x="60" y="30" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="13" font-weight="bold" fill="#b71c1c">后端微服务</text>
    
    <rect x="20" y="60" width="80" height="30" rx="3" fill="#fff" stroke="#ef5350" />
    <text x="60" y="80" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="10" fill="#c62828">微服务 A</text>
    
    <rect x="20" y="110" width="80" height="30" rx="3" fill="#fff" stroke="#ef5350" />
    <text x="60" y="130" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="10" fill="#c62828">微服务 B</text>
    
    <text x="60" y="170" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="10" font-style="italic" fill="#c62828">...</text>
  </g>

  <!-- Return Flow -->
  <path d="M750,340 L710,340 L710,450 L100,450 L100,350" fill="none" stroke="#546e7a" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead)" />
  <text x="400" y="440" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="12" fill="#546e7a">HTTP 响应</text>

  <!-- Legend -->
  <g transform="translate(50, 520)">
    <text x="0" y="0" font-family="Microsoft YaHei, Arial" font-size="12" font-weight="bold" fill="#333">流程说明：</text>
    <text x="0" y="20" font-family="Microsoft YaHei, Arial" font-size="11" fill="#666">1. 客户端发送请求到网关。</text>
    <text x="0" y="35" font-family="Microsoft YaHei, Arial" font-size="11" fill="#666">2. 网关处理器映射根据断言（Predicate）找到匹配的路由。</text>
    <text x="0" y="50" font-family="Microsoft YaHei, Arial" font-size="11" fill="#666">3. 网关 Web 处理器执行过滤器链（Filter Chain）。</text>
    <text x="400" y="20" font-family="Microsoft YaHei, Arial" font-size="11" fill="#666">4. Pre 过滤器：转发请求前执行逻辑（如鉴权、限流、参数修改）。</text>
    <text x="400" y="35" font-family="Microsoft YaHei, Arial" font-size="11" fill="#666">5. 转发请求到后端微服务，并获取响应。</text>
    <text x="400" y="50" font-family="Microsoft YaHei, Arial" font-size="11" fill="#666">6. Post 过滤器：获取响应后执行逻辑（如日志统计、响应头修改）。</text>
  </g>
</svg>
