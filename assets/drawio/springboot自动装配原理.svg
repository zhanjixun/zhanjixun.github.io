<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#333" />
    </marker>
    <marker id="dashed-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#666" />
    </marker>
  </defs>

  <!-- Lifelines -->
  <g transform="translate(100, 50)">
    <line x1="0" y1="40" x2="0" y2="420" stroke="#333" stroke-width="2" stroke-dasharray="5,5" />
    <rect x="-60" y="0" width="120" height="40" rx="5" fill="#e1f5fe" stroke="#01579b" stroke-width="2" />
    <text x="0" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">SpringBootApp</text>
  </g>

  <g transform="translate(300, 50)">
    <line x1="0" y1="40" x2="0" y2="420" stroke="#333" stroke-width="2" stroke-dasharray="5,5" />
    <rect x="-80" y="0" width="160" height="40" rx="5" fill="#e1f5fe" stroke="#01579b" stroke-width="2" />
    <text x="0" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">ImportSelector</text>
  </g>

  <g transform="translate(520, 50)">
    <line x1="0" y1="40" x2="0" y2="420" stroke="#333" stroke-width="2" stroke-dasharray="5,5" />
    <rect x="-80" y="0" width="160" height="40" rx="5" fill="#e1f5fe" stroke="#01579b" stroke-width="2" />
    <text x="0" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">FactoriesLoader</text>
  </g>

  <g transform="translate(720, 50)">
    <line x1="0" y1="40" x2="0" y2="420" stroke="#333" stroke-width="2" stroke-dasharray="5,5" />
    <rect x="-70" y="0" width="140" height="40" rx="5" fill="#e1f5fe" stroke="#01579b" stroke-width="2" />
    <text x="0" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">ConfigurationRegistry</text>
  </g>

  <!-- Activation boxes -->
  <rect x="95" y="100" width="10" height="300" fill="#fff" stroke="#333" />
  <rect x="295" y="110" width="10" height="220" fill="#fff" stroke="#333" />
  <rect x="515" y="130" width="10" height="80" fill="#fff" stroke="#333" />

  <!-- Messages -->
  <g>
    <line x1="105" y1="120" x2="295" y2="120" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="200" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">1. selectImports()</text>
  </g>

  <g>
    <line x1="305" y1="140" x2="515" y2="140" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="410" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">2. loadFactoryNames()</text>
  </g>

  <!-- Self call -->
  <g>
    <path d="M525,150 L550,150 L550,180 L525,180" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="555" y="170" font-family="Arial, sans-serif" font-size="10">读取 spring.factories</text>
  </g>

  <g>
    <line x1="515" y1="210" x2="305" y2="210" stroke="#666" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#dashed-arrow)" />
    <text x="410" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">3. 返回候选配置类</text>
  </g>

  <g>
    <path d="M305,240 L330,240 L330,280 L305,280" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="335" y="265" font-family="Arial, sans-serif" font-size="10">4. filter() 过滤 &amp; 排除</text>
  </g>

  <g>
    <line x1="305" y1="310" x2="715" y2="310" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="510" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">5. register BeanDefinitions</text>
  </g>

  <g>
    <line x1="295" y1="330" x2="105" y2="330" stroke="#666" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#dashed-arrow)" />
    <text x="200" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">6. 自动装配完成</text>
  </g>

  <!-- Legend / Title -->
  <text x="400" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#01579b">Spring Boot 自动装配时序图</text>
</svg>
