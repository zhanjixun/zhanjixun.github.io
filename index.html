<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Java知识体系</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <meta name="description" content="Description">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <link rel="stylesheet" href="assets/css/vue.css"/>
    <style type="text/css">
        .sidebar-nav > ul > li.file p > a {
            font-size: 15px;
            font-weight: 700;
            color: #364149;
        }

        .sidebar-nav .folder {
            cursor: pointer;
        }
    </style>
    <style>
        .sidebar-nav ul {
            list-style-type: none;
        }
        <!--排除标题-->
        .sidebar-nav > ul > li:first-child > a::before {
            content: none !important;
        }
        .sidebar-nav > ul > ul {
            counter-reset: lv1;
        }
        .sidebar-nav > ul > ul > li {
            counter-increment: lv1;
            counter-reset: lv2;
        }
        .sidebar-nav > ul > ul > li > a::before {
            content: counter(lv1, cjk-ideographic) "、";
        }
        .sidebar-nav > ul > ul > ul > li {
            counter-increment: lv2;
            counter-reset: lv3;
        }
        .sidebar-nav > ul > ul > ul > li > a::before {
            content: counter(lv1) "." counter(lv2) " ";
        }
        .sidebar-nav > ul > ul  > ul > ul > li {
            counter-increment: lv3;
        }
        .sidebar-nav > ul > ul  > ul > ul > li > a::before {
            content: counter(lv1) "." counter(lv2) "." counter(lv3) " ";
        }
    </style>
    <style>
        /* 1. 初始化容器：在正文区域重置所有计数器 */
        .markdown-section {
          counter-reset: h2count;
        }

        /* 2. H1 不做任何处理（跳过） */

        /* 3. 处理 H2：中文序号（第一章） */
        .markdown-section h2 {
          counter-increment: h2count;
          counter-reset: h3count; /* 当遇到新的 H2 时，重置 H3 的计数 */
        }

        .markdown-section h2::before {
          /* 使用 cjk-ideographic 实现中文一、二、三 */
          content: counter(h2count, cjk-ideographic) "、";
        }

        /* 4. 处理 H3：数字序号（1.1） */
        .markdown-section h3 {
          counter-increment: h3count;
          counter-reset: h4count; /* 当遇到新的 H3 时，重置 H4 的计数 */
        }

        .markdown-section h3::before {
          content: counter(h2count) "." counter(h3count) " ";
        }

        /* 5. 处理 H4：数字序号（1.1.1） */
        .markdown-section h4 {
          counter-increment: h4count;
        }

        .markdown-section h4::before {
          content: counter(h2count) "." counter(h3count) "." counter(h4count) " ";
        }
    </style>
    <!-- CDN files for docsify-katex -->
    <!--    <script src="//cdn.jsdelivr.net/npm/docsify-katex@latest/dist/docsify-katex.js"></script>-->
    <!--    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.css"/>-->
</head>
<body>
<div id="app">加载中...</div>
<script>
    window.$docsify = {
        // repo: 'https://github.com/zhanjixun/zhanjixun.github.io',
        loadSidebar: false,
        maxLevel: 6,
        subMaxLevel: 5,
        coverpage: true,
        onlyCover: true,
        auto2top: true,
        mergeNavbar: true,
        markdown: {
            renderer: {
                code: function (code, lang) {
                    if (lang === "mermaid") {
                        return ('<div class="mermaid">' + mermaid.render('mermaid-svg-' + num++, code) + "</div>");
                    }
                    return this.origin.code.apply(this, arguments);
                }
            }
        },
        copyCode: {
            buttonText: '复制',
            errorText: '复制失败',
            successText: '复制成功'
        },
        pagination: {
            previousText: '上一篇',
            nextText: '下一篇',
            crossChapter: true,
            crossChapterText: true,
        },
        count: {
            countable: true,
            fontsize: '0.9em',
            color: 'rgb(90,90,90)',
            language: 'chinese'
        }
    }
</script>
<!-- docsify -->
<script src="assets/js/docsify.min.js"></script>

<!-- docsify plugins -->
<!-- Support docsify sidebar catalog expand and collapse -->
<script src="assets/js/docsify-sidebar-collapse.min.js"></script>
<!-- Medium's image zoom -->
<script src="assets/js/zoom-image.min.js"></script>
<!-- Add a simple Click to copy button to all preformatted code blocks to effortlessly allow users to copy example code from your docs -->
<script src="assets/js/docsify-copy-code.min.js"></script>
<!-- docsify-pagination -->
<script src="assets/js/docsify-pagination.min.js"></script>
<script src="assets/js/countable.min.js"></script>

<!-- code highlight -->
<script src="assets/js/prism-bash.min.js"></script>
<script src="assets/js/prism-csharp.min.js"></script>
<script src="assets/js/prism-java.min.js"></script>
<script src="assets/js/prism-json.min.js"></script>
<script src="assets/js/prism-markdown.min.js"></script>
<script src="assets/js/prism-nginx.min.js"></script>
<script src="assets/js/prism-properties.min.js"></script>
<script src="assets/js/prism-sql.min.js"></script>
<script src="assets/js/prism-xml-doc.min.js"></script>
<script src="assets/js/prism-yaml.min.js"></script>

</body>
<!-- mermaid -->
<script src="assets/js/mermaid.min.js"></script>
<script>
    // mermaid
    var num = 0;
    mermaid.initialize({startOnLoad: false});
</script>
</html>
