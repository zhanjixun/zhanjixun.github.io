<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Java知识体系</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <meta name="description" content="Description">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <link rel="stylesheet" href="css/vue.css"/>
    <style type="text/css">
        .sidebar-nav > ul > li.file p > a {
            font-size: 15px;
            font-weight: 700;
            color: #364149;
        }

        .sidebar-nav .folder {
            cursor: pointer;
        }
    </style>
    <style type="text/css">
        /*sidebar添加目录序号*/
        .sidebar-nav ul {
            counter-reset: a;
        }

        .sidebar-nav > ul > li > a:before, .sidebar-nav > ul > li:not(:has(> a)):before {
            counter-increment: a;
            content: counter(a) '\3001';
        }

        .sidebar-nav > ul > li li > a:before, .sidebar-nav > ul > li li:not(:has(> a)):before {
            counter-increment: a;
            content: counters(a, ".") " ";
        }
    </style>
    <style type="text/css">
        /*markdown文章添加目录序号*/
        .markdown-section h2 {
            /*遇到h2标签就重置h3的计数器*/
            counter-reset: h3counter;
            /*累加h2的计数器*/
            counter-increment: h2counter;
        }

        .markdown-section h2 > a > span:before {
            /*在before位置添加content*/
            content: counter(h2counter)'\3001';
        }

        .markdown-section h3 {
            counter-reset: h4counter;
            counter-increment: h3counter;
        }

        .markdown-section h3 > a > span:before {
            content: counter(h2counter)"."counter(h3counter)" ";
        }

        .markdown-section h4 {
            counter-increment: h4counter;
        }

        .markdown-section h4 > a > span:before {
            content: counter(h2counter)"."counter(h3counter)"."counter(h4counter)" ";
        }
    </style>
    <!-- CDN files for docsify-katex -->
    <script src="//cdn.jsdelivr.net/npm/docsify-katex@latest/dist/docsify-katex.js"></script>
    <!-- or <script src="//cdn.jsdelivr.net/gh/upupming/docsify-katex@latest/dist/docsify-katex.js"></script> -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.css"/>
</head>
<body>
<div id="app">加载中...</div>
<script>
    window.$docsify = {
        name: 'Java知识体系',
        nameLink: '/#/README',
        repo: 'https://github.com/zhanjixun/zhanjixun.github.io',
        loadSidebar: true,
        maxLevel: 6,
        subMaxLevel: 5,
        coverpage: true,
        onlyCover: true,
        auto2top: true,
        mergeNavbar: true,
        search: {
            noData: {
                '/zh/': '没有结果!',
                '/en/': 'No results!',
                '/': '没有结果!',
            },
            paths: 'auto',
            placeholder: {
                '/zh/': '搜索',
                '/en/': 'Search',
                '/': '搜索',
            }
        },
        markdown: {
            renderer: {
                code: function (code, lang) {
                    if (lang === "mermaid") {
                        return ('<div class="mermaid">' + mermaid.render('mermaid-svg-' + num++, code) + "</div>");
                    }
                    return this.origin.code.apply(this, arguments);
                }
            }
        },
        copyCode: {
            buttonText: '复制',
            errorText: '失败',
            successText: '已复制'
        },
        pagination: {
            previousText: '上一篇',
            nextText: '下一篇',
            crossChapter: true,
            crossChapterText: true,
        },
        count: {
            countable: true,
            fontsize: '0.9em',
            color: 'rgb(90,90,90)',
            language: 'chinese'
        }
    }
</script>
<!-- docsify -->
<script src="//unpkg.com/docsify@4.12.2/lib/docsify.min.js"></script>

<!-- docsify plugins -->
<!-- support search -->
<script src="//unpkg.com/docsify@4.12.2/lib/plugins/search.min.js"></script>
<!-- Support docsify sidebar catalog expand and collapse -->
<script src="//unpkg.com/docsify-sidebar-collapse@1.3.5/dist/docsify-sidebar-collapse.min.js"></script>
<!-- Medium's image zoom -->
<script src="//unpkg.com/docsify@4.12.2/lib/plugins/zoom-image.min.js"></script>
<!-- Add a simple Click to copy button to all preformatted code blocks to effortlessly allow users to copy example code from your docs -->
<script src="//unpkg.com/docsify-copy-code@2.1.1/dist/docsify-copy-code.min.js"></script>
<!-- docsify-pagination -->
<script src="//unpkg.com/docsify-pagination@2.6.2/dist/docsify-pagination.min.js"></script>
<script src="//unpkg.com/docsify-count/dist/countable.min.js"></script>

<!-- code highlight -->
<script src="//unpkg.com/prismjs@1.27.0/components/prism-bash.min.js"></script>
<script src="//unpkg.com/prismjs@1.27.0/components/prism-csharp.min.js"></script>
<script src="//unpkg.com/prismjs@1.27.0/components/prism-java.min.js"></script>
<script src="//unpkg.com/prismjs@1.27.0/components/prism-json.min.js"></script>
<script src="//unpkg.com/prismjs@1.27.0/components/prism-markdown.min.js"></script>
<script src="//unpkg.com/prismjs@1.27.0/components/prism-nginx.min.js"></script>
<script src="//unpkg.com/prismjs@1.27.0/components/prism-properties.min.js"></script>
<script src="//unpkg.com/prismjs@1.27.0/components/prism-sql.min.js"></script>
<script src="//unpkg.com/prismjs@1.27.0/components/prism-xml-doc.min.js"></script>
<script src="//unpkg.com/prismjs@1.27.0/components/prism-yaml.min.js"></script>

</body>
<!-- mermaid -->
<script src="//unpkg.com/mermaid@8.14.0/dist/mermaid.min.js"></script>
<script>
    // mermaid
    var num = 0;
    mermaid.initialize({startOnLoad: false});
</script>
</html>
